# MineScripture configuration
#
# config_version is how the plugin knows this file predates a change to the
# shipped defaults. Bump it whenever a default VALUE changes (not just when keys
# are added); on startup an older file is backed up and replaced, because a stale
# value silently overriding a fix is almost impossible to notice from in-game.
config_version: 5
#
# API keys: leave these empty and use environment variables instead (recommended):
#   MSC_YVP_KEY      - YouVersion Platform app key
#   MSC_GLOO_ID      - Gloo AI Studio client id
#   MSC_GLOO_SECRET  - Gloo AI Studio client secret
# Values set here override the environment only if non-empty.

youversion:
  app_key: ""
  # Any version this app key is licensed for. Licensed versions need their
  # publisher's fast-track agreement accepted once in the YouVersion developer
  # dashboard; until then passages 403 while the version's metadata still 200s.
  # A single verse can override this — see "bible_id" in fallback.json.
  bible_id: 111           # New International Version (Biblica fast-track)

gloo:
  client_id: ""
  client_secret: ""
  # Design intent: recommend Scripture based on the human moment and biblical
  # themes, without applying a denominational lens. Mapped to Gloo's accepted
  # tradition value at request time; admins may set a specific tradition.
  tradition: broad_christian
  temperature: 0.4
  # Measured Gloo latency drifts: 4.4-7.2s one day, 6.9-11.1s the next. A cap set
  # to yesterday's numbers silently times out half of today's calls, and every
  # timeout is a curated verse rather than an interpreted one — which also makes
  # levity impossible, since only a live reading is ever toned "light". Set well
  # clear of the tail; the respawn screen absorbs the wait, and arriving late
  # beats arriving generic.
  timeout_ms_sudden: 15000      # hard cap for death/diamonds/low-health path
  timeout_ms_background: 20000  # background restock of cached interpretations

# Levity: on tone-light moments (comedic deaths), serve humor instead of a verse.
# levity_ai additionally allows a short AI-generated quip (clearly separated from
# Scripture, LevityGuard-validated). On by default: the model writing the joke is
# the point of asking it to judge the moment, and an install that never shows one
# misrepresents what the plugin does. Set false for a curated-only deployment.
levity: true
levity_ai: true

budget:
  player_per_hour: 10
  server_per_hour: 100

cooldowns:
  global_s: 90            # minimum gap between any two presentations per player
  global_priority_s: 15   # shorter floor for death / diamonds / first-times, so a
                          # death moments after a discovery is still allowed to speak
  session_cap: 12         # max presentations per player per session
  levity_s: 600           # separate cooldown for humor

# Death pacing. A run of quick deaths thins out rather than going silent: each
# death waits escalation_factor times longer than the last, capped, and the run
# resets after run_reset_s without dying. There is no lockout — a player having a
# terrible night still hears something.
deaths:
  escalation_factor: 1.75
  max_cooldown_s: 300
  run_reset_s: 600

presentation:
  chime: true
  # Passages longer than this are shown in a shortened form when one exists.
  # Gloo decides which words to drop and may ONLY delete — the result is checked
  # to be a subsequence of the verse before it is used, so every word shown is
  # still YouVersion's word in YouVersion's order. /verse always replays the
  # whole verse. Set to 0 to always show passages in full.
  abridge_over_chars: 160
