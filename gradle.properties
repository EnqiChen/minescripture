# Gradle 8.14 cannot itself run on Java 25, but Paper 26.2's API is Java 25
# bytecode. So Gradle runs on JDK 21 and compiles through a JDK 25 toolchain.
# This tells Gradle where to find that JDK; adjust the path for your machine,
# or remove this line if JDK 25 is installed somewhere Gradle auto-detects.
org.gradle.java.installations.paths=../tools/jdk-25/Contents/Home
